# Accepted vulnerability findings.
#
# Empty, and that is a claim rather than an omission: the scan has not run, so nothing has been
# accepted. A file pre-populated with plausible exceptions would be a decision made before its evidence.
#
# Every entry needs four fields, and tests/test_security_exceptions.py refuses one that does not:
#
#   [[exception]]
#   id       = "CVE-2024-12345"     # the finding's identifier, as the scanner reports it
#   package  = "libfoo"             # the package it applies to, so a fix elsewhere does not silently
#                                   # keep the exception alive
#   reason   = "..."                # prose, at least forty characters, saying why this is accepted
#                                   # here. "false positive" is not a reason; why it is one is.
#   expires  = 2026-11-30           # a date, unquoted. Past it the SUITE fails, not the scan.
#
# The expiry fails the suite rather than the scan on purpose. The scan needs a daemon; the expiry is a
# fact about this file, so it is checkable on any machine and an exception rots loudly on a laptop.
# Record 019 argues all of it.
#
# Renewing an exception means editing the date and the reason together. A date moved on its own is the
# thing this file exists to prevent.
