[build-system]
requires = ["setuptools==70.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mlops-platform"
version = "0.1.0"
description = "Local-first MLOps spine: compose, images, charts, infra"
requires-python = ">=3.11,<3.13"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest==8.2.2",
  "pyyaml==6.0.1",
  "ruff==0.5.0",
  "mypy==1.10.0",
  "pre-commit==3.7.1",
  "types-PyYAML==6.0.12.20240311",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "PTH", "RUF", "ANN", "S"]
ignore = [
  # A Protocol-typed parameter is deliberately broad; ANN401 would forbid the only honest annotation.
  "ANN401",
  # Deprecated upstream: annotating `self` and `cls` is noise, not information.
  "ANN101",
  "ANN102",
]

[tool.ruff.lint.per-file-ignores]
# A test suite is assertions. S101 would forbid the only thing it does.
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "integration: requires a running container runtime; skipped when none is present",
]

# This repository ships infrastructure, not a library. The Python here is the test suite
# for the configuration, so there is no package to distribute.
[tool.setuptools]
packages = []
