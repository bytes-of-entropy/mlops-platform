# The local spine. Every service here has an offline-first job to do: object storage
# stands in for S3, MLflow for a hosted tracking server, Airflow for a managed
# scheduler, Postgres for both metadata stores.
#
# Tags are pinned deliberately. `latest` makes a green build unreproducible the next
# morning, which is the one property this repository exists to demonstrate. A pin buys
# reproducibility, not availability: the Spark image this file used to name was deleted
# from Docker Hub by its publisher, and a digest pin would have died with the repository
# just the same. See docs/decisions/005-migrate-off-the-withdrawn-spark-image.md.
#
# That has now happened twice, to two publishers, in one file. The second was the artifact store
# (docs/decisions/026), so the sentence above is a measurement rather than a caution.

# Worker sizing, and nothing else. The Apache image takes a daemon's role from its command
# rather than from an environment variable, but org.apache.spark.deploy.worker.Worker still
# reads these two out of the environment when no flag overrides them. That is what lets the
# quickstart resize a worker exactly the way it always did, and what keeps
# test_spark_worker_heap_fits_its_container reading the value it checks.
x-spark-worker-env: &spark-worker-env
  SPARK_WORKER_MEMORY: 6g
  SPARK_WORKER_CORES: "2"

services:
  spark-master:
    image: apache/spark:3.5.9-python3@sha256:af02a459c8706e031c835c16f9db3c463816776e2543dd0f828af65606bcf392
    # This image's entrypoint passes any non-Kubernetes command straight through, so the
    # standalone daemons are named explicitly. spark-class runs in the foreground, which is
    # what a container needs; sbin/start-master.sh daemonises and the container would exit.
    #
    # --host is not decoration either. The master advertises the address it binds to, and
    # without this it binds to the container hostname, a short container ID that changes
    # every up. Naming the service makes the advertised URL identical to the one the workers
    # are given below, which is one fewer thing that can drift.
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
    # The host half of every published port is a variable with today's number as its default, so
    # `make up` publishes exactly what it always did. The integration tier sets these to 0 and lets
    # Docker pick free ports at bind time. A compose project name isolates containers, networks and
    # volumes but not published host ports, so with fixed numbers here the tier could not start
    # while a by-hand stack was up, and the bind error surfaced under test names about idempotency.
    ports:
      - "${SPARK_MASTER_UI_HOST_PORT:-8080}:8080"
      - "${SPARK_MASTER_HOST_PORT:-7077}:7077"
    healthcheck:
      # wget rather than curl: this image ships gnupg2, wget, bash, tini, procps and
      # net-tools, and no curl at all. A healthcheck naming a binary the image lacks never
      # reports healthy, so a --wait would sit for the full timeout and read as a broken
      # service rather than a broken healthcheck.
      test: ["CMD", "wget", "-qO-", "http://localhost:8080"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g

  spark-worker-1:
    image: apache/spark:3.5.9-python3@sha256:af02a459c8706e031c835c16f9db3c463816776e2543dd0f828af65606bcf392
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
    environment: *spark-worker-env
    depends_on:
      spark-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 7g

  spark-worker-2:
    image: apache/spark:3.5.9-python3@sha256:af02a459c8706e031c835c16f9db3c463816776e2543dd0f828af65606bcf392
    profiles: ["full"]
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
    environment: *spark-worker-env
    depends_on:
      spark-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 7g

  # SeaweedFS, under a service name that still says minio. The name, the volume and the two
  # variables are deliberately unchanged: the image had to move because `minio/minio` was withdrawn
  # from Docker Hub -- the repository, not one tag, so the digest pin went with it and this file paid
  # for the lesson in its own header a second time. Renaming the component is a separate change with
  # separate consequences, so it is a separate commit. See docs/decisions/026.
  minio:
    image: chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
    # One process holding the whole cluster: master, volume server, filer and the S3 gateway. The
    # filer is not named because `-s3` starts it either way, and asking for both would suggest the
    # gateway could be had without it.
    #
    # `-s3.port=9000` overrides this image's default of 8333 so that the endpoint every consumer
    # below already names stays correct. That keeps this change an image swap rather than a port
    # migration through the compose file, the chart, the guide and the README.
    command: ["server", "-s3", "-s3.port=9000"]
    environment:
      # Read only when the filer holds no S3 configuration of its own. That precedence is the
      # hazard: this gateway starts with no identities and then accepts *any* key offered to it, so
      # an identity persisted into the volume below outranks these two silently, and the failure is
      # an open gateway that answers every probe in this file correctly. A kept volume deciding
      # which credentials are live is record 007 again, in a component replaced for unrelated
      # reasons. test_object_storage_refuses_a_wrong_credential is what makes enforcement a fact.
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "${MINIO_API_HOST_PORT:-9000}:9000"
    volumes:
      - minio-data:/data
    healthcheck:
      # curl, which this image installs by name in its Dockerfile. It ships no `mc`, so the
      # previous healthcheck would never have reported healthy here -- the Spark mistake again.
      #
      # One endpoint, not two. MinIO's `live` and `ready` answered different questions and were
      # worth probing separately; here /healthz and /status are bound to the same handler, so a
      # second probe would assert the same thing twice and imply a distinction that does not exist.
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g

  # A one-shot provisioner rather than a service. It creates the buckets the spine's consumers
  # are configured to write to, and exits. Three deliberate properties:
  #
  # The image this repository already builds for MLflow, because that is where boto3 already is. An
  # earlier version of this service ran `mc mb --ignore-existing` in the MinIO image, which does ship
  # `mc`; that `mc` rejected the invocation, printed its top-level help into a pager and exited 1.
  # boto3 has semantics that can be reasoned about before running rather than discovered on the
  # build machine: one call, two documented "already there" codes, everything else raised
  # (`docs/decisions/015`).
  #
  # No healthcheck, because it is not meant to stay up. What gates its consumers is
  # `service_completed_successfully`, which is a stronger guarantee than a healthcheck: a
  # healthcheck says a service answers, completion says the work is done.
  #
  # No `restart` policy. A provisioner that restarts never completes, so the condition above
  # would never fire and `up --wait` would hang until its timeout.
  #
  # Bucket creation lives here and not in MLflow's start-up so that only this step needs
  # permission to create a bucket. MLflow is left needing read and write inside one, which is the
  # distinction that matters the moment root credentials are replaced by a real role.
  minio-init:
    image: mlops-platform/mlflow:2.22.4
    # Declared so this service can build the image it needs on its own, rather than `run minio-init`
    # depending on some earlier `up` having built it.
    #
    # It does not come free, which this comment claimed until 2026-08-31 and the first `make push`
    # disproved. Buildx exports the tag once per service that declares the build, so `make build`
    # produces it twice and the later export wins the tag. The layers are cached and identical; the
    # two exports differ in metadata, most likely the provenance attestation's timestamps, and so
    # carry different manifest digests. Compose reports `1/1`, which is why it went unseen for so
    # long. Record 023 has the evidence and the options; nothing here runs differently, but the
    # digest of the published image is decided by export order.
    build:
      context: images/mlflow
    entrypoint: ["python", "/opt/ensure_buckets.py"]
    command: ["mlflow"]
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    depends_on:
      minio:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256m

  postgres:
    image: postgres:16.15-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-platform}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g

  mlflow:
    # The only built image in the spine, and it exists for two pip packages the published MLflow
    # image does not carry. `image` is still a pinned tag rather than a bare build: the tag is what
    # `ps` and `inspect` report, and the base image it is built from is pinned inside the Dockerfile
    # where a contract test can read it (`docs/decisions/011`).
    image: mlops-platform/mlflow:2.22.4
    build:
      context: images/mlflow
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-platform}
      --default-artifact-root s3://mlflow/
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "${MLFLOW_HOST_PORT:-5000}:5000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      # Not just that MinIO answers, but that the bucket `--default-artifact-root` names exists.
      # Without this the server starts healthy and fails on the first artifact write, which is
      # how the missing bucket survived a green M0: nothing in the smoke path logs an artifact.
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      # python rather than curl: this image ships an interpreter by construction and does not
      # promise curl. A healthcheck naming a binary the image lacks never reports healthy, so it
      # reads as a broken service rather than a broken healthcheck; see Spark, where the same
      # mistake was already caught once.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health').read()"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g

  airflow:
    image: apache/airflow:2.11.2-python3.11@sha256:aac8468234dfa802c5ac4d6318bbf3b620793b55569ac230f584dc3c1f0ca49d
    profiles: ["full"]
    command: standalone
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?generate one and set AIRFLOW_FERNET_KEY in .env}
      # The image acts on the two credentials below only when told to. Without these flags
      # they are inert: "airflow standalone" then invents its own admin password and writes
      # it to a file inside the container, so the documented login exists nowhere but the
      # documentation. Migration is not optional here either: creating a user needs a
      # schema, and the entrypoint tolerates its own failure, so an unmigrated database
      # turns the create into a no-op and hands the password back to standalone.
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      # Pinned rather than configurable: standalone looks for a user named exactly "admin"
      # and creates one with a random password when it does not find one. Any other name
      # here leaves a second account nobody can log into.
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?set AIRFLOW_ADMIN_PASSWORD in .env}
      # Where the DAGs write. A literal rather than an interpolated variable: it names a service
      # on this network, so there is exactly one correct value and nothing for an operator to
      # choose. The smoke DAG reads this name and refuses if it is unset, rather than defaulting
      # to an address nobody configured.
      MLFLOW_TRACKING_URI: http://mlflow:5000
    ports:
      - "${AIRFLOW_HOST_PORT:-8082}:8080"
    volumes:
      - airflow-logs:/opt/airflow/logs
      - ./airflow/dags:/opt/airflow/dags:ro
    # Postgres only. MLflow is where the DAGs write, not something Airflow needs in order to
    # start, and gating start-up on it would turn a tracking server that is slow to come up into
    # a scheduler that never does. The smoke DAG is run after `up --wait`, by which point compose
    # has waited on every service in the profile.
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # python rather than curl: this is a python image by construction, so the interpreter is the
      # one dependency it cannot be missing. Same reasoning as the Spark healthcheck above, one step
      # further: nothing here depends on which utilities the base image happened to include, so a
      # base-image change cannot turn a healthy service into an unhealthy one.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health').read()"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 3g

volumes:
  minio-data:
  postgres-data:
  airflow-logs:
