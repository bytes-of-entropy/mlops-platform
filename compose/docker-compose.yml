# The local spine. Every service here has an offline-first job to do: object storage
# stands in for S3, MLflow for a hosted tracking server, Airflow for a managed
# scheduler, Postgres for both metadata stores.
#
# Tags are pinned deliberately. `latest` makes a green build unreproducible the next
# morning, which is the one property this repository exists to demonstrate. A pin buys
# reproducibility, not availability: the Spark image this file used to name was deleted
# from Docker Hub by its publisher, and a digest pin would have died with the repository
# just the same. See docs/decisions/005-migrate-off-the-withdrawn-spark-image.md.

# Worker sizing, and nothing else. The Apache image takes a daemon's role from its command
# rather than from an environment variable, but org.apache.spark.deploy.worker.Worker still
# reads these two out of the environment when no flag overrides them. That is what lets the
# quickstart resize a worker exactly the way it always did, and what keeps
# test_spark_worker_heap_fits_its_container reading the value it checks.
x-spark-worker-env: &spark-worker-env
  SPARK_WORKER_MEMORY: 6g
  SPARK_WORKER_CORES: "2"

services:
  spark-master:
    image: apache/spark:3.5.1-python3
    # This image's entrypoint passes any non-Kubernetes command straight through, so the
    # standalone daemons are named explicitly. spark-class runs in the foreground, which is
    # what a container needs; sbin/start-master.sh daemonises and the container would exit.
    #
    # --host is not decoration either. The master advertises the address it binds to, and
    # without this it binds to the container hostname -- a short container ID that changes
    # every up. Naming the service makes the advertised URL identical to the one the workers
    # are given below, which is one fewer thing that can drift.
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
    ports:
      - "8080:8080"
      - "7077:7077"
    healthcheck:
      # wget rather than curl: this image ships gnupg2, wget, bash, tini, procps and
      # net-tools, and no curl at all. A healthcheck naming a binary the image lacks never
      # reports healthy, so a --wait would sit for the full timeout and read as a broken
      # service rather than a broken healthcheck.
      test: ["CMD", "wget", "-qO-", "http://localhost:8080"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g

  spark-worker-1:
    image: apache/spark:3.5.1-python3
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
    environment: *spark-worker-env
    depends_on:
      spark-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 7g

  spark-worker-2:
    image: apache/spark:3.5.1-python3
    profiles: ["full"]
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
    environment: *spark-worker-env
    depends_on:
      spark-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 7g

  minio:
    image: minio/minio:RELEASE.2024-06-04T19-20-08Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g

  postgres:
    image: postgres:16.3-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-platform}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.13.0
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-platform}
      --default-artifact-root s3://mlflow/
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g

  airflow:
    image: apache/airflow:2.9.2-python3.11
    profiles: ["full"]
    command: standalone
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?generate one and set AIRFLOW_FERNET_KEY in .env}
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER:?set AIRFLOW_ADMIN_USER in .env}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?set AIRFLOW_ADMIN_PASSWORD in .env}
    ports:
      - "8082:8080"
    volumes:
      - airflow-logs:/opt/airflow/logs
      - ./airflow/dags:/opt/airflow/dags:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 3g

volumes:
  minio-data:
  postgres-data:
  airflow-logs:
