name: supply

# Weekly and on demand, not on every push, and the reason is what the gate measures rather than
# cost. A scan result is a function of the SBOM, the scanner and the vulnerability database. The
# first two change only when a commit changes them, and the contract tier already covers the code
# that produces them on every push. The third changes daily without anybody committing anything,
# which means the interesting question this job answers -- has a new advisory appeared against these
# images -- is a question about elapsed time, not about a diff. Running it per push would answer the
# same question repeatedly on a busy day and not at all on a quiet week.
#
# Monday morning UTC, so a firing lands at the start of a week rather than into a Friday evening.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  # Also whenever the things it measures actually change, which is the one push-shaped trigger that
  # earns its keep: a base image bump or a change to the gate itself should be checked immediately
  # rather than up to a week later.
  push:
    paths:
      - "compose/docker-compose.yml"
      - "images/**"
      - "sbom/*.known.txt"
      - "supply/**"
      - "Makefile"
      - ".github/workflows/supply.yml"

jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
      - name: install
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[dev]"

      # Compose refuses to parse its own file without these, so `make build` cannot run without a
      # .env even though nothing here starts a container. Every credential is interpolated as
      # `${VAR:?set VAR in .env}` -- the form that refuses rather than substituting an empty value --
      # so that no default can become a committed secret and no machine starts successfully without
      # one. The property that protects the credentials is what makes this step necessary, and the
      # first run of this workflow failed here in 0s with that exact message.
      #
      # The same generation the ci.yml idempotency job uses: runner-local, single-use, never printed.
      # These values are interpolated and then discarded -- nothing in this job reads them, and the
      # image being built does not depend on any of them. Duplicated rather than shared because the
      # alternative is a composite action to save eight lines, and
      # tests/test_workflow_contract.py asserts the two jobs cannot drift apart.
      - name: generate local credentials
        run: |
          {
            echo "MINIO_ROOT_USER=ci$(openssl rand -hex 6)"
            echo "MINIO_ROOT_PASSWORD=$(openssl rand -hex 24)"
            echo "POSTGRES_USER=ci$(openssl rand -hex 6)"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
            echo "POSTGRES_DB=platform"
            echo "AIRFLOW_ADMIN_PASSWORD=$(openssl rand -hex 24)"
            echo "AIRFLOW_FERNET_KEY=$(openssl rand -base64 32)"
          } >> .env

      # The one image this repository builds has to exist locally before it can be catalogued, and
      # cataloguing it is the point: it is the only image in the spine whose contents are a decision
      # made here. `--profile full` matches what `make sbom` walks.
      - name: build the spine's own image
        run: make build

      - name: catalogue every image
        run: make sbom

      # The inventories are committed, so a regeneration that differs is either a change nobody
      # committed or a cataloguer that is not reproducible. Record 019 tested the second by hand once
      # and this is where it stops being a one-off observation.
      - name: the committed inventories still describe these images
        run: |
          if ! git diff --exit-code -- sbom/; then
            echo "::error::sbom/ changed. Either an image moved without its inventory being"
            echo "::error::committed, or the cataloguer is not reproducible. Record 019 argues both"
            echo "::error::matter; the diff above says which."
            exit 1
          fi

      # The gate. Fails on an advisory identifier absent from the committed baseline for that image,
      # which includes advisories published since the baseline was taken -- see record 022, where
      # that is a designed behaviour rather than a false alarm.
      - name: scan against the committed baselines
        run: make scan

      # Uploaded whatever the outcome, because the run that fails is the one whose report is worth
      # reading, and the SPDX documents and raw findings are deliberately not committed.
      - name: keep the reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: supply-reports
          path: |
            sbom/*.spdx.json
            sbom/*.findings.json
          retention-days: 30
