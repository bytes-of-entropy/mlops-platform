name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[dev]"
      - name: lint
        # The three checks `make lint` runs, in the same order. The format check was missing here
        # while the local gate ran it, which is the wrong way round: a formatting-drifted branch
        # went green in CI and was rejected on the machine that had to merge it.
        run: |
          .venv/bin/python -m ruff format --check .
          .venv/bin/python -m ruff check .
          .venv/bin/python -m mypy
      - name: hooks
        # Overlaps the lint step on ruff, deliberately. What it adds is the file hygiene nothing
        # else checked: a private key, a file over 512 KiB, a merge-conflict marker, malformed
        # YAML -- and in a repository whose whole subject is compose files and .env handling, a
        # committed credential is the failure worth a redundant second of wall clock. Run here
        # rather than trusted to an installed hook, so a clone that never ran setup is checked too.
        run: .venv/bin/python -m pre_commit run --all-files
      - name: contract suite
        run: .venv/bin/python -m pytest -m "not integration"

  idempotency:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[dev]"
      - name: generate local credentials
        # Runner-local, single-use, never printed. The .env file exists for the length of
        # this job and the values are read from nowhere else.
        run: |
          {
            echo "MINIO_ROOT_USER=ci$(openssl rand -hex 6)"
            echo "MINIO_ROOT_PASSWORD=$(openssl rand -hex 24)"
            echo "POSTGRES_USER=ci$(openssl rand -hex 6)"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
            echo "POSTGRES_DB=platform"
            echo "AIRFLOW_ADMIN_PASSWORD=$(openssl rand -hex 24)"
            echo "AIRFLOW_FERNET_KEY=$(openssl rand -base64 32)"
          } >> .env
      - name: quickstart cycle
        run: .venv/bin/python -m pytest -m integration
