name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
      - name: install
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[dev]"
      - name: lint
        # The three checks `make lint` runs, in the same order. The format check was missing here
        # while the local gate ran it, which is the wrong way round: a formatting-drifted branch
        # went green in CI and was rejected on the machine that had to merge it.
        run: |
          .venv/bin/python -m ruff format --check .
          .venv/bin/python -m ruff check .
          .venv/bin/python -m mypy
      - name: hooks
        # Overlaps the lint step on ruff, deliberately. What it adds is the file hygiene nothing
        # else checked: a private key, a file over 512 KiB, a merge-conflict marker, malformed
        # YAML, and in a repository whose whole subject is compose files and .env handling, a
        # committed credential is the failure worth a redundant second of wall clock. Run here
        # rather than trusted to an installed hook, so a clone that never ran setup is checked too.
        run: .venv/bin/python -m pre_commit run --all-files
      - name: contract suite
        run: .venv/bin/python -m pytest -m "not integration"

  idempotency:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
      - name: install
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[dev]"
      - name: generate local credentials
        # Runner-local, single-use, never printed. The .env file exists for the length of
        # this job and the values are read from nowhere else.
        run: |
          {
            echo "MINIO_ROOT_USER=ci$(openssl rand -hex 6)"
            echo "MINIO_ROOT_PASSWORD=$(openssl rand -hex 24)"
            echo "POSTGRES_USER=ci$(openssl rand -hex 6)"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
            echo "POSTGRES_DB=platform"
            echo "AIRFLOW_ADMIN_PASSWORD=$(openssl rand -hex 24)"
            echo "AIRFLOW_FERNET_KEY=$(openssl rand -base64 32)"
          } >> .env
      - name: quickstart cycle
        # `not cluster` because this runner has docker and no kind. Selecting the cluster tier here
        # would skip it, and a skip inside the integration tier reads as a pass, which is the one
        # thing that tier's zero-skip rule exists to prevent. Excluded by selection, so the count
        # this job reports is a count of tests that actually ran.
        run: .venv/bin/python -m pytest -m "integration and not cluster"

  chart:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
      - uses: Azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1
        with:
          # Helm 3's current release, not Helm 4's. Helm 4 exists and is newer, and this chart has
          # never been rendered by it; the version CI uses is the version the chart's `tested-on`
          # annotation can honestly name. Chart apiVersion v2 is what Helm 3 reads, so moving to 4
          # is a change to make deliberately with a run behind it rather than by taking a default.
          version: v3.21.4
      - name: install
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[dev]"
      - name: helm lint and render
        # The half of the chart's correctness Python cannot reach. `tests/test_chart_templates.py`
        # pseudo-renders the templates by dropping their control lines, which navigates structure
        # and cannot prove a template renders at all: an unclosed `{{- if`, a pipeline into a
        # function that does not exist, a `.Values` path that resolves to nil mid-expression are all
        # invisible to it and all fatal here. `helm template` is the stricter of the two, because
        # `lint` tolerates a chart that renders to nothing.
        run: make chart-lint
      - name: chart contract suite
        # Also run in the contract job, and cheap. Kept here so a helm-only failure and a
        # chart-assertion failure land in the same place, rather than one job saying the chart
        # renders and another saying its values are wrong.
        run: .venv/bin/python -m pytest tests/test_chart_contract.py tests/test_chart_templates.py
