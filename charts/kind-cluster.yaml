# The kind cluster this chart is developed against.
#
# Everything here exists because kind is not EKS, which is exactly why it is in this file and not in
# the chart. `OFFLINE_FIRST.md` promises "same manifests, same Helm charts" between the two, and that
# is only true if the cluster's peculiarities live outside the templates.
#
# Used by `make kind-up`:
#   kind create cluster --name mlops-platform --config charts/kind-cluster.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: mlops-platform

nodes:
  - role: control-plane
    # Kept, and no longer load-bearing. `controller-v1.15.1`'s kind manifest selects only on
    # `kubernetes.io/os: linux` and reaches the host through `hostPort` on 80 and 443; the
    # `ingress-ready` label it used to require is not in that manifest any more, which was verified by
    # reading the manifest at the pinned tag rather than assumed from how kind's own guide reads.
    #
    # It stays because it costs one kubelet argument, because the label is what several versions either
    # side of this one do select on, and because a cluster that carries it works with both. Removing it
    # would make the pin and the config a matched pair that must move together, which is the kind of
    # coupling the digest pinning in record 018 exists to avoid needing to remember.
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    # A cloud load balancer answers an Ingress from outside the cluster. kind has none, so the node's
    # own 80 and 443 are published to the host instead. This is the substitution `OFFLINE_FIRST.md`
    # names -- kind for EKS, ALB absent -- made concrete.
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP

# One node, deliberately. Extra workers would let a reviewer watch pods spread across them, which
# looks impressive and demonstrates nothing this milestone claims: the HPA's question is whether
# replicas appear, not which node they land on. Each additional node is another kubelet and another
# container runtime inside a 4 GB budget that already has a control plane in it.
