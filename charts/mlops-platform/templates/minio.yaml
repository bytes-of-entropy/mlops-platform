{{- if .Values.minio.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "mlops-platform.fullname" . }}-minio
  labels:
    {{- include "mlops-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: minio
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.minio.persistence.storageClass }}
  storageClassName: {{ .Values.minio.persistence.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.minio.persistence.size }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mlops-platform.fullname" . }}-minio
  labels:
    {{- include "mlops-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: minio
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.minio.service.apiPort }}
      targetPort: api
      protocol: TCP
      name: api
  selector:
    {{- include "mlops-platform.selectorLabels" (dict "root" . "component" "minio") | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mlops-platform.fullname" . }}-minio
  labels:
    {{- include "mlops-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: minio
spec:
  replicas: 1
  # `Recreate`, for the same reason as Postgres: one ReadWriteOnce volume cannot be held by an old
  # pod and a new one at once, so a rolling update deadlocks on itself.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "mlops-platform.selectorLabels" (dict "root" . "component" "minio") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mlops-platform.labels" . | nindent 8 }}
        app.kubernetes.io/component: minio
    spec:
      securityContext:
        {{- toYaml .Values.minio.podSecurityContext | nindent 8 }}
      containers:
        - name: minio
          image: {{ include "mlops-platform.image" .Values.minio.image }}
          imagePullPolicy: {{ .Values.minio.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.minio.securityContext | nindent 12 }}
          # The whole cluster in one process -- master, volume server, filer, S3 gateway. `-s3`
          # starts the filer on its own, so naming it as well would imply the gateway could run
          # without one. `-dir` and the volume limits come from the image's entrypoint, which
          # prepends them; only what differs from its defaults is stated here.
          args:
            - server
            - -s3
            - -s3.port={{ .Values.minio.service.apiPort }}
          env:
            # The S3 credentials, from the same Secret keys the rest of the spine reads, under the
            # names this server looks for. They are a *fallback*: consulted only when the filer
            # holds no S3 configuration of its own, and this server accepts any key at all when it
            # has neither. So the failure mode is not a refused connection, it is an object store
            # that answers every probe on this page and authenticates nobody, which is why the
            # compose tier asserts a wrong credential is rejected rather than asserting these are
            # set. The alternative, a `-s3.config` identities file, would put a credential in
            # plaintext on disk and is rejected for that reason alone.
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentials.secretName }}
                  key: {{ .Values.credentials.keys.minioRootUser }}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentials.secretName }}
                  key: {{ .Values.credentials.keys.minioRootPassword }}
          ports:
            - name: api
              containerPort: {{ .Values.minio.service.apiPort }}
              protocol: TCP
          # Two probes against one path, which is the honest shape here. MinIO published `live` and
          # `ready` as separate questions and they were worth asking separately; this server binds
          # /healthz and /status to the same handler, so a second path would imply a distinction the
          # implementation does not make. The probes still differ in what they *do* with the answer:
          # readiness withdraws the endpoint, liveness restarts the pod, and those remain different
          # consequences for the same signal.
          readinessProbe:
            httpGet:
              path: /healthz
              port: api
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: api
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.minio.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          {{- if .Values.minio.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "mlops-platform.fullname" . }}-minio
          {{- else }}
          emptyDir: {}
          {{- end }}
