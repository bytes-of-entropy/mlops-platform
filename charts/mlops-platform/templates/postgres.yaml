{{- if .Values.postgres.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "mlops-platform.fullname" . }}-postgres
  labels:
    {{- include "mlops-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.postgres.persistence.storageClass }}
  storageClassName: {{ .Values.postgres.persistence.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.postgres.persistence.size }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mlops-platform.fullname" . }}-postgres
  labels:
    {{- include "mlops-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.postgres.service.port }}
      targetPort: postgres
      protocol: TCP
      name: postgres
  selector:
    {{- include "mlops-platform.selectorLabels" (dict "root" . "component" "postgres") | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mlops-platform.fullname" . }}-postgres
  labels:
    {{- include "mlops-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  replicas: 1
  # `Recreate`, not the default `RollingUpdate`. A rolling update would start a second Postgres
  # against the same ReadWriteOnce volume, and the new pod would sit Pending on a volume the old one
  # still holds while the old one is never asked to leave. One replica and one volume means the old
  # pod has to go first.
  #
  # This is a Deployment rather than a StatefulSet on purpose, and record 024 argues it: at one
  # replica there is no ordinal identity to preserve and no per-replica storage to template, so a
  # StatefulSet would add a concept the milestone explicitly excludes and buy nothing. It is also the
  # wrong answer for production, which the record says out loud rather than leaving implied.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "mlops-platform.selectorLabels" (dict "root" . "component" "postgres") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mlops-platform.labels" . | nindent 8 }}
        app.kubernetes.io/component: postgres
    spec:
      securityContext:
        {{- toYaml .Values.postgres.podSecurityContext | nindent 8 }}
      containers:
        - name: postgres
          image: {{ include "mlops-platform.image" .Values.postgres.image }}
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.postgres.securityContext | nindent 12 }}
          env:
            {{- include "mlops-platform.postgresEnv" . | nindent 12 }}
            # The image initialises into a subdirectory rather than the mount root, because a
            # ReadWriteOnce volume on several providers arrives with a `lost+found` in it, and
            # `initdb` refuses a directory that is not empty.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: {{ .Values.postgres.service.port }}
              protocol: TCP
          # `sh -c` because a probe's exec command gets no variable substitution from Kubernetes --
          # that applies to `command` and `args` only -- and `pg_isready` needs the user and database
          # the Secret carries. The shell expands them from the container's own environment.
          readinessProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          {{- if .Values.postgres.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "mlops-platform.fullname" . }}-postgres
          {{- else }}
          emptyDir: {}
          {{- end }}
