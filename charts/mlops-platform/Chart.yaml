apiVersion: v2
name: mlops-platform
description: MLflow tracking with its Postgres backend store and MinIO artifact store, on Kubernetes

# `application`, not `library`: this chart renders workloads. A library chart would be the right
# answer if the flagships needed to build on these templates, and they do not -- they pin a release
# and deploy alongside it.
type: application

# The chart's own version, and the one another repository pins. It is deliberately not the
# repository's tag: the repository tags milestones (v0.2.0 closed M1), and a chart that changed
# whenever any part of the repository did would force consumers to re-pin for changes that cannot
# affect them. Orderable SemVer because record 014 requires a consumer be able to compare and range
# over it.
version: 0.1.0

# What is inside, rather than what this chart is. Quoted because 2.22.4 unquoted is not a string and
# a YAML parser is entitled to make it something else. Matches the MLflow the compose spine runs; a
# contract test asserts the two agree, since a chart claiming a version the images do not carry is a
# worse lie than no claim.
appVersion: "2.22.4"

keywords:
  - mlflow
  - mlops
home: https://github.com/bytes-of-entropy/mlops-platform
sources:
  - https://github.com/bytes-of-entropy/mlops-platform

maintainers:
  - name: bytes-of-entropy

annotations:
  # What a consumer needs to know before pinning this, stated where a chart repository will show it
  # rather than only in a record it will not read. Both are true and both are limits.
  mlops-platform/scope: >-
    MLflow, Postgres and MinIO. Spark and Airflow are in the compose spine and deliberately not here:
    neither is a plain Deployment on Kubernetes, and modelling them as one would misrepresent how they
    run. See docs/decisions/024.
  mlops-platform/tested-on: >-
    kind only. EKS portability is a property of this chart's structure and is not yet demonstrated.
