# Pinned by revision, not by tag, so a hook cannot change under a green build.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
        # Helm templates are not YAML. `{{ include ... }}` is a flow mapping to a YAML parser and a
        # function call to Helm, so every template under charts/ fails this hook while being correct.
        # Excluded rather than silenced: what checks those files is `helm lint` and `helm template` in
        # CI, plus tests/test_chart_contract.py and tests/test_chart_templates.py, which read them as
        # text on machines that have no helm. Chart.yaml and values.yaml are real YAML and stay in.
        exclude: ^charts/[^/]+/templates/
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=512"]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      # ruff-check, not the `ruff` alias: at this rev the old id still runs but announces itself
      # as legacy, and an id that is on its way out is not what a pinned config should name.
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format
